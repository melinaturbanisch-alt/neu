<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sanisa Mitarbeiter-Login</title>
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..600;1,6..96,400..600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; background: var(--beige); padding: 16px; }
    .login { background: #fff; border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: var(--radius); padding: 36px 28px; width: 100%; max-width: 400px; display: grid; gap: 14px; }
    .login img { height: 48px; width: auto; margin: 0 auto 8px; }
    .login h1 { font-size: 1.6rem; text-align: center; margin: 0; }
    .login label { display: grid; gap: 8px; font-size: .74rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    .login input { font: 400 1rem var(--sans); padding: 11px 12px; border: 1px solid #d4d4d8; border-radius: 6px; }
    .login .hint { font-size: .85rem; color: var(--muted); text-align: center; margin: 0; }
    .back { color: var(--muted); text-align: center; display: block; margin-top: 16px; font-size: .9rem; }
  </style>
</head>
<body>
  <div>
    <form class="login" onsubmit="event.preventDefault(); document.getElementById('h').textContent='Der Login wird im nächsten Schritt angebunden.';">
      <img src="assets/img/logo.png" alt="Sanisa Baumaschinen Handel">
      <h1>Mitarbeiter-Login</h1>
      <label>Benutzername<input name="user" autocomplete="username"></label>
      <label>Passwort<input name="pass" type="password" autocomplete="current-password"></label>
      <button class="btn btn-primary btn-block" type="submit">Anmelden</button>
      <p class="hint" id="h">Hier tragen Mitarbeiter neue Fahrzeuge ein (in Vorbereitung).</p>
    </form>
    <a href="index.html" class="back">← Zurück zur Website</a>
  </div>
</body>
</html>
